name: Fetch 10 Newest Threats

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - surajdiksha-web-1
    paths-ignore:
      - "10_new_threat.txt"
      - "latest_cisa_10kev.txt"
      - "just_the_counts.txt"

permissions:
  contents: write

concurrency:
  group: fetch-10-newest-threats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published site branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch LiveCVE snapshot
        run: curl --fail --silent --show-error --location --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors 'https://livecve.com/api/threats.php?limit=10' --output '10_new_threat.txt'
      - name: Commit refreshed snapshot
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '10_new_threat.txt'
          if git diff --cached --quiet; then
            echo "Snapshot has not changed."
            exit 0
          fi
          git commit -m "Refresh 10_new_threat.txt LiveCVE snapshot"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$TARGET_BRANCH"
            git rebase FETCH_HEAD
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish the refreshed snapshot after retries." >&2
          exit 1
