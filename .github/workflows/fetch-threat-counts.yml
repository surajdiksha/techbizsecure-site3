name: Fetch LiveCVE Threat Counts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: fetch-livecve-threat-counts
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published site branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Fetch LiveCVE snapshot
        run: curl --fail --silent --show-error --location --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 --retry-all-errors 'https://livecve.com/api/threats.php?stats=1' --output 'just_the_counts.txt'
      - name: Commit refreshed snapshot
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'just_the_counts.txt'
          if git diff --cached --quiet; then
            echo "Snapshot has not changed."
            exit 0
          fi
          git commit -m "Refresh just_the_counts.txt LiveCVE snapshot"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "$TARGET_BRANCH"
            git rebase FETCH_HEAD
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            sleep 2
          done
          echo "Could not publish the refreshed snapshot after retries." >&2
          exit 1
